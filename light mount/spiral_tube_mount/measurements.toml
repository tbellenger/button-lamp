[tube_od]
value = 13.0
unit = "mm"
how = "Silicone neon tube outside diameter, the 5 mm-strip version. plywood/src/spiral.py default_params(tube_od=13) and plywood/PLAN.md."

[old_spiral_coil_od]
value = 91.44
unit = "mm"
how = "Coil outside diameter of the original printed spiral. Measured from original-plans/3D Printable Parts (STL Files)/Spiral (with base).stl (Y and Z extents both 91.440 mm). plywood/PLAN.md records the same 91.44 mm outside diameter, a 22.35 mm tube, and a 68.6 mm centre-line (radius 34.3)."

[coil_diameter]
value = 100.0
unit = "mm"
how = "Outside diameter of the coil, tube included. Centre-line radius is (100 - 13) / 2 = 43.5 mm, which is 10 mm more than the 33.5 mm radius of the 80 mm coil. Tom asked for that 10 mm on 2026-11-08."

[coil_gap]
value = 10.0
unit = "mm"
how = "Clear gap between neighbouring turns of the silicone tube. Pitch = tube_od + coil_gap = 23 mm, so each base clip steps up by 5.75 mm."

[strip_length]
value = 1000.0
unit = "mm"
how = "LED strip in the coil: 160 LEDs. plywood/src/spiral.py strip_len and plywood/PLAN.md."

[top_deck_flange_size]
value = 92.0
unit = "mm"
how = "Old cage flange, 92 mm, from container/plywood/src/spiral.py. The 100 mm coil does not fit in that square. The plywood top is 122 mm front to back and 210 mm left to right, and the new base is a 100 mm square, which does fit."

[top_deck_bolt_spacing]
value = 76.2
unit = "mm"
how = "Button Lamp top-deck 4-bolt square, 76.2 mm (3.000 in, +/-38.1 mm). container/plywood/src/spiral.py bolt_sq=76.2 bolt_d=3.4. Same holes as light mount/matrix_16x16_mount, verified there against fj125_top_qty1_mm.dxf and sm_al063_hood_qty1_mm.dxf."

[top_deck_wire_offset_x]
value = 11.71
unit = "mm"
how = "Deck light-cable hole, lateral offset from the bolt-pattern centre (+X to the right). 116.712 - 105.0 = +11.712 mm. From fj125_top_qty1_mm.dxf, recorded in light mount/matrix_16x16_mount/measurements.toml."

[top_deck_wire_offset_y]
value = 32.24
unit = "mm"
how = "Deck light-cable hole, rearward offset from the bolt-pattern centre (+Y toward the back). 61.0 - 28.761 = 32.239 mm. From fj125_top_qty1_mm.dxf."

[top_deck_wire_hole_dia]
value = 10.0
unit = "mm"
how = "As-cut diameter of the deck light-cable hole, verified in the committed fj125_top and sheet-metal DXFs. Not the design target. See light_cable_hole_dia."

[light_cable_hole_dia]
value = 15.0
unit = "mm"
how = "Design diameter of the light-cable hole. Tom, 2026-11-08: add 5 mm to the Ø10 hole. Drawn by container/plywood/src/box.py, the finger-joint top, container/sheetmetal/src/sm.py, and the printed top_backer_plate. A board or hood already cut at Ø10 has to be opened by hand; the file change does not enlarge it."

[mount_cable_window_dia]
value = 19.0
unit = "mm"
how = "Hole in the printed base and the size the cable path must stay. The previous mount used Ø14 over the Ø10 deck hole, 4 mm larger on the diameter. 15 + 4 = 19."

[m3_clearance]
value = 3.4
unit = "mm"
how = "M3 medium clearance, ISO 273. Matches plywood/src/spiral.py bolt_d=3.4 and the Ø3.4 mm holes in fj125_top_qty1_mm.dxf. The original Spiral (with base).stl used Ø6.35 mm holes on this same 76.2 mm square for the old plastic enclosure; the plywood and sheet-metal decks are M3."
