[tube_od]
value = 13.0
unit = "mm"
how = "Silicone neon tube outside diameter, the 5 mm-strip version. Same tube as light mount/four_tower_spiral."

[coil_diameter]
value = 100.0
unit = "mm"
how = "Outside of the coil, tube included. Centre-line radius (100 - 13) / 2 = 43.5 mm. Same coil as the side-printed four-tower mount."

[pitch]
value = 26.0
unit = "mm"
how = "Rise per turn. Exactly twice the 13 mm tube OD, so the clear gap between turns is 13 mm. A quarter turn rises 6.5 mm. Hooks on one tower are one pitch apart. Neighbours are a quarter turn, 6.5 mm."

[tube_length]
value = 965.2
unit = "mm"
how = "Cut length of the silicone tube along its centreline. 38 inches. 38 * 25.4 = 965.2 mm. 72.90 mm of that is a straight tangent. The helix is the other 892.30 mm, exactly 3.25 turns, so it starts in the first clip and the cut end is the centre of the last clip. See system.py."

[top_deck_bolt_spacing]
value = 76.2
unit = "mm"
how = "Top-deck 4-bolt square, 76.2 mm, centres at (+/-38.1, +/-38.1). Same holes as light mount/four_tower_spiral."

[top_deck_wire_offset_x]
value = 11.71
unit = "mm"
how = "Light-cable hole, +X from the bolt centre. 116.712 - 105.0 = +11.712 mm, from fj125_top_qty1_mm.dxf."

[top_deck_wire_offset_y]
value = 32.24
unit = "mm"
how = "Light-cable hole, +Y (toward the back) from the bolt centre. 61.0 - 28.761 = 32.239 mm, from fj125_top_qty1_mm.dxf."

[light_cable_hole_dia]
value = 15.0
unit = "mm"
how = "Design diameter of the deck and backer light-cable hole. The as-cut plywood was Ø10. This mount does not cover a Ø15 hole."

[mount_cable_window_dia]
value = 19.0
unit = "mm"
how = "Clear window this ring keeps open at the cable coordinate. The cross mount used Ø19, 4 mm larger than the Ø15 deck hole."

[m3_clearance]
value = 3.4
unit = "mm"
how = "M3 medium clearance, ISO 273. Matches the Ø3.4 mm holes in the deck."
