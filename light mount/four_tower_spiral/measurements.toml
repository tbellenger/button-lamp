unit = "mm"
how = "Silicone neon tube outside diameter, the 5 mm-strip version. container/plywood/src/spiral.py default_params(tube_od=13)."

[coil_diameter]
value = 100.0
unit = "mm"
how = "Outside of the coil, tube included. Centre-line radius (100 - 13) / 2 = 43.5 mm. Same coil as light mount/spiral_tube_mount."

[coil_gap]
value = 10.0
unit = "mm"
how = "Clear gap between turns. Pitch = tube_od + coil_gap = 23 mm. A quarter turn is 5.75 mm of rise."

[strip_length]
value = 1000.0
unit = "mm"
how = "LED strip in the coil, 160 LEDs. container/plywood/src/spiral.py strip_len. Stations are counted along the tube centre-line."

[top_deck_bolt_spacing]
value = 76.2
unit = "mm"
how = "Top-deck 4-bolt square, 76.2 mm, centres at (+/-38.1, +/-38.1). container/plywood/src/spiral.py bolt_sq. Same holes as the cross mount and the matrix."

